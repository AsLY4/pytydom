[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytydom"
version = "0.1.0"
description = "Home-Assistant-independent client for Delta Dore Tydom gateways"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["pytydom*"]
